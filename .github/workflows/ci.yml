name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: hydrox
          MYSQL_DATABASE: hydrox
          MYSQL_USER: hydrox
          MYSQL_PASSWORD: hydrox
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uhydrox -phydrox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://hydrox:hydrox@127.0.0.1:3306/hydrox
      PORT: 3000
      API_PORT: 3000
      APP_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3000
      WEB_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECRET: hydrox-ci-cookie-secret
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Unit tests
        run: yarn test
      - name: Build
        run: yarn build
      - name: Migrate database
        run: yarn db:migrate
      - name: Integration tests
        run: yarn test:integration
      - name: Install Playwright Chromium
        run: yarn workspace @hydrox/web exec playwright install --with-deps chromium
      - name: Start app
        run: |
          yarn workspace @hydrox/api start > /tmp/hydrox-app.log 2>&1 &
          echo $! > /tmp/hydrox-app.pid
      - name: Wait for app
        run: bash docker/scripts/wait-for-http.sh http://127.0.0.1:3000/ready 90 2
      - name: E2E tests
        run: yarn test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '--- app log ---'
          cat /tmp/hydrox-app.log 2>/dev/null || true
      - name: Stop servers
        if: always()
        run: kill "$(cat /tmp/hydrox-app.pid 2>/dev/null)" 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Build app image
        run: docker build -f docker/api.Dockerfile --target runner -t hydrox-app .
      - name: Stack probe (prod compose)
        run: yarn test:stack:prod
        env:
          APP_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:3000
          WEB_URL: http://127.0.0.1:3000
