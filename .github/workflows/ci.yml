name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hydrox
          POSTGRES_PASSWORD: hydrox
          POSTGRES_DB: hydrox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hydrox -d hydrox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hydrox:hydrox@localhost:5432/hydrox
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Unit tests
        run: yarn test
      - name: Integration tests
        run: yarn test:integration

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/api.Dockerfile --target runner -t hydrox-api .
      - name: Build web image
        run: docker build -f docker/web.Dockerfile --target runner -t hydrox-web .
