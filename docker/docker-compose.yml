services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hydrox
      POSTGRES_PASSWORD: hydrox
      POSTGRES_DB: hydrox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrox -d hydrox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4.3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - localstack:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d:ro

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: dev
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://hydrox:hydrox@postgres:5432/hydrox
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://localstack:4566
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - ../:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    command: sh -c "yarn workspace @hydrox/db migrate || true; yarn workspace @hydrox/api dev"

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      target: dev
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ../:/app
      - /app/node_modules
    depends_on:
      - api
    command: yarn workspace @hydrox/web dev --host 0.0.0.0

volumes:
  pgdata:
  localstack:
